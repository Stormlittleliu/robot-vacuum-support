# Single-tenant cloud/demo deployment: backend is internal-only; nginx is the
# only published port and serves the native static product UI.
#
#   cp .env.docker.example .env.docker
#   # fill RVS_ADMIN_TOKEN / RVS_ACCESS_TOKEN (required) and optional key
#   docker compose --env-file .env.docker up -d --build
#
# The required `:?` interpolations intentionally fail closed when tokens are
# missing. Never commit .env.docker.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RVS_SERVE_STATIC: "false"
      RVS_BIND_HOST: "0.0.0.0"
      RVS_PORT: "8000"
      RVS_ASSETS_ROOT: "/assets"
      RVS_KNOWLEDGE_DIR: "/assets/knowledge"
      RVS_MODEL_DIR: "/assets/models/bge-small-zh-v1.5"
      RVS_RAG_INDEX_DIR: "/assets/rag_index"
      RVS_INSTANCE_NAME: "${RVS_INSTANCE_NAME:-扫地机器人售后客服}"
      RVS_ADMIN_TOKEN: "${RVS_ADMIN_TOKEN:?RVS_ADMIN_TOKEN is required}"
      RVS_ACCESS_TOKEN: "${RVS_ACCESS_TOKEN:?RVS_ACCESS_TOKEN is required}"
      RVS_ALLOWED_ORIGINS: "${RVS_ALLOWED_ORIGINS:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
    volumes:
      # Read-only local assets. Restore them from the trusted backup first.
      - ./assets/knowledge:/assets/knowledge:ro
      - ./assets/models/bge-small-zh-v1.5:/assets/models/bge-small-zh-v1.5:ro
      - ./assets/rag_index:/assets/rag_index:ro
      # Writable runtime: artifact build, sessions, workspace, logs, outputs.
      - rvs-data:/data
    expose:
      - "8000"
    networks:
      - rvs-internal
    # Uvicorn gets SIGTERM through the exec'd entrypoint and has 10s to drain;
    # give Docker a little more room before SIGKILL so in-flight SSE can close.
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    volumes:
      - ./product_ui:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - rvs-internal
    restart: unless-stopped

networks:
  rvs-internal:
    driver: bridge

volumes:
  rvs-data:
