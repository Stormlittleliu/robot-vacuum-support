# Static frontend + same-origin API reverse proxy for the single-tenant demo.
# The backend listens only on the internal compose network; this server is the
# only published port.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API: keep the /api prefix, disable buffering/cache for SSE.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-store" always;
    }

    location = /admin {
        return 302 /admin.html;
    }

    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /admin.html {
        add_header Cache-Control "no-store" always;
    }

    # Public API base config. Deployments may mount an override here; keep the
    # default same-origin "/api" unless the backend is hosted separately.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        types { application/javascript js; }
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
